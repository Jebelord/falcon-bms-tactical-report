name: Build Executables (Auto)

# Esto hace que el robot se active SOLO cuando publicas una nueva "Release"
on:
  release:
    types: [published]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: bms_report_builder
            release_name: bms_report_builder_Linux
          - os: windows-latest
            artifact_name: bms_report_builder.exe
            release_name: bms_report_builder_Windows.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Linux Dependencies (for GUI)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb

    - name: Install Python Requirements
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter pillow

    - name: Build Executable (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        pyinstaller --noconfirm --onefile --noconsole --name bms_report_builder --add-data "Icons:Icons" --add-data "sound fx:sound fx" bms_report_builder.py

    - name: Build Executable (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        pyinstaller --noconfirm --onefile --noconsole --name bms_report_builder --add-data "Icons;Icons" --add-data "sound fx;sound fx" --icon "Icons/launcher_logo.ico" bms_report_builder.py

    - name: Rename Linux Artifact
      if: matrix.os == 'ubuntu-latest'
      run: mv dist/${{ matrix.artifact_name }} dist/${{ matrix.release_name }}

    - name: Rename Windows Artifact
      if: matrix.os == 'windows-latest'
      run: mv dist/${{ matrix.artifact_name }} dist/${{ matrix.release_name }}
      shell: bash

    - name: Upload Binaries to Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.release_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
